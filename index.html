<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- タブのアイコン。ロゴ「本ちゃか」の、金茶の本からのぞくカエルを正方形に切り出したもの(2026-10-07)。
         元は public/brand/honchaka-mark.svg(作り方は src/components/FrogMark.tsx の StudioLogo) -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!--
      検索の題(2026-10-19 修正リスト 40)。Google で「本ちゃか」と探したとき、題に「本ちゃか」が出るように、
      題・og:title・og:site_name・説明の頭・画面の h1(StartScreen の .hero-name)・下の構造化データで、名前を「本ちゃか」にそろえた。
      前は「本ちゃか — ひっちゃか本づくりスタジオ」で、Google が「—」の後ろだけを題に出していた。
      **以下の題と説明の文は Gemini Flash の見直しずみ(2026-10-19)。** 直すときは、題・og:title・構造化データの name/alternateName を食い違わせない。
      題のタグはこの1つだけにする(試しの版の組み立てが、頭に試しの印を付けるため。vite.config.ts の channelHtml)。
      この注を含め、index.html には試しの印の文字を書かないこと(scripts/channel.test.ts が最初の1つだけを外して比べる)
    -->
    <title>本ちゃか（ひっちゃか本づくりスタジオ）｜無料の本づくりツール</title>
    <meta
      name="description"
      content="本ちゃかは、Word やテキストの原稿を入れるだけで、縦書きでも横書きでも、EPUB と KDP 入稿用 PDF をブラウザだけで作れる無料の本づくりツールです。原稿は外に送られません。"
    />
    <!--
      SNS に貼られたときの見え方(OGP)。
      **og:image と og:url だけは絶対 URL でなければならない** — クローラは
      ページの場所を知らずに読むので、`./banners/...` のような相対では拾えない。
      vite の base は './' なので、ここだけが公開先を直に書いている場所になる。
      **置き場所を変えたら下の2つも直すこと**(docs/xserver-upload.md の手順)。
      画像は public/banners/ogp-1200x630.png(scripts/build-banners.py で作る)。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="本ちゃか" />
    <meta property="og:title" content="本ちゃか（ひっちゃか本づくりスタジオ）｜無料の本づくりツール" />
    <meta
      property="og:description"
      content="本ちゃかは、だれでも気軽に本をつくれる無料サービスです。書き上げた原稿を、そのまま紙の本と電子書籍の形にします。原稿は外に送られません。"
    />
    <meta property="og:url" content="https://www.hittyaka-maker.com/bookstudio/" />
    <meta property="og:image" content="https://www.hittyaka-maker.com/bookstudio/banners/ogp-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      構造化データ(JSON-LD。2026-10-19 修正リスト 40)。検索エンジンに「本ちゃか」という名前の無料の Web アプリで、
      別名が「ひっちゃか本づくりスタジオ」、出している所があまやどり出版だと、画面の見た目とは別に伝える。
      Google が題をどう決めるかは Google しだいなので、これで必ず「本ちゃか」が出るとは言えない。
      url は og:url・src/shop.ts の APP_URL と同じ値(3つが食い違わないように)。
      この index.html はどの版でも共通なので、版ごとに違う言葉は入れない
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "本ちゃか",
        "alternateName": "ひっちゃか本づくりスタジオ",
        "url": "https://www.hittyaka-maker.com/bookstudio/",
        "description": "本ちゃかは、Wordやテキストの原稿を、縦書きでも横書きでも、紙の本（KDP入稿用PDF）と電子書籍（EPUB）の形にできる、ブラウザで使う無料の本づくりツールです。",
        "inLanguage": "ja",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Windows, macOS",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" },
        "publisher": {
          "@type": "Organization",
          "name": "あまやどり出版",
          "url": "https://www.hittyaka-maker.com/"
        }
      }
    </script>

    <!--
      画面の色を**最初の1枚を描く前に**決める。
      React が立ち上がってから貼ると、暗い画面の人に明るい地が一瞬だけ光る。
      中身は src/theme.ts と同じ判定の写しで、鍵の名前('book-studio-theme')も同じ。
      **片方だけ変えないこと。** 覚えかたと既定の理由は theme.ts に書いてある。
    -->
    <script>
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem('book-studio-theme');
        } catch (e) {
          /* localStorage が使えない環境では OS の設定だけで決める */
        }
        var mode =
          pref === 'light' || pref === 'dark'
            ? pref
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = mode;
      })();
    </script>
  </head>
  <body>
    <!--
      とても古いブラウザで真っ白にならないように(2026-10-13 運用の見直し 12 / 対応環境)。
      #root の中の文は、React が描いた時点で消える(createRoot は中身を置き換える)。ふつうの人の画面には出ない。
      出し始めは CSS のアニメーションの待ち(animation-delay)で遅らせる: 「読み込んでいます…」は 4 秒、古いブラウザの文は 20 秒。
      遅いパソコン・遅い回線の初回の読み込み(数秒〜十数秒)でも、20 秒までは古いブラウザの文を出さない。
      アニメーションを知らないほど古いブラウザでは、待たずにすぐ出る(fill-mode の backwards で隠しているだけなので)。
      この index.html はどの版でも共通なので、版ごとに違う言葉は入れない。
      対応環境の数字は src/help/content.ts の HELP_ENV と合わせる
    -->
    <style>
      .boot-wait { margin: 18vh auto 0; max-width: 34em; padding: 0 16px; font-size: 14px; line-height: 1.9; text-align: center; color: #888; }
      .boot-wait p { margin: 0 0 10px; }
      .boot-wait-1 { -webkit-animation: boot-show 0.4s 4s both; animation: boot-show 0.4s 4s both; }
      .boot-wait-2 { -webkit-animation: boot-show 0.4s 20s both; animation: boot-show 0.4s 20s both; }
      @-webkit-keyframes boot-show { from { opacity: 0; } to { opacity: 1; } }
      @keyframes boot-show { from { opacity: 0; } to { opacity: 1; } }
    </style>
    <div id="root">
      <div class="boot-wait">
        <p class="boot-wait-1">読み込んでいます…</p>
        <p class="boot-wait-2">
          画面が変わらないときは、ページを読み込み直してください。それでも動かない場合は、ブラウザが古い可能性があります。<br />
          対応環境: Windows 10・11 / macOS 13 以降の Google Chrome・Microsoft Edge の最新版
        </p>
      </div>
    </div>
    <noscript>
      <!-- JavaScript が切られているときは、上の待ちの文を出さずに、こちらだけ -->
      <style>.boot-wait { display: none; }</style>
      <p style="margin: 18vh auto 0; max-width: 34em; padding: 0 16px; font-size: 14px; line-height: 1.9; text-align: center">
        本ちゃかを使うには、ブラウザの JavaScript を有効にしてください。<br />
        対応環境: Windows 10・11 / macOS 13 以降の Google Chrome・Microsoft Edge の最新版
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
