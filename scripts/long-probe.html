<!doctype html>
<!--
  **長い本で、どこに時間がかかっているか**を機械で測るための、検査専用のページ。

  ユーザー報告(2026-08-21)「297頁で3分くらいで画面が見えるようになって、
  全部が見えるようになるまでにさらに10分以上」「タブ移動もできない」。
  rebuild-probe は**組み直しを繰り返して溜まるもの**を測る道具で、
  こちらは**1冊が長いこと**そのものを測る。

  開発サーバーから開く:
    http://localhost:PORT/scripts/long-probe.html?scale=9
    http://localhost:PORT/scripts/long-probe.html?scale=1,3,9   （まとめて並べる）
    http://localhost:PORT/scripts/long-probe.html?scale=9&all=0 （renderAllPages を切って測る）

  測り終わると #probe-result に JSON が入り、document.title が
  「PROBE-DONE」か「PROBE-FAIL」に変わる。
  ふだんは scripts/check-typeset.py --only-screen が headless Chrome ごと回す。

  **入れ子はアプリと同じにする。**(.preview-viewport > 素のdiv > 誌面)
-->
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>PROBE-RUNNING</title>
    <style>
      html, body { margin: 0; height: 100%; }
      #probe-stage { position: absolute; inset: 0 0 140px 0; }
      #probe-stage[hidden] { display: none; }
      #probe-viewport { position: absolute; inset: 0 116px 0 0; overflow: auto; }
      #probe-thumbs { position: absolute; inset: 0 0 0 auto; width: 116px; overflow: auto; }
      #probe-result { position: absolute; z-index: 9; inset: auto 0 0 0; max-height: 140px; overflow: auto; font: 12px monospace; white-space: pre-wrap; background: #fff; }
    </style>
  </head>
  <body>
    <div id="probe-stage">
      <div id="probe-viewport"></div>
      <div id="probe-thumbs" class="thumbs"></div>
    </div>
    <pre id="probe-result"></pre>
    <script type="module" src="./long-probe.ts"></script>
  </body>
</html>
